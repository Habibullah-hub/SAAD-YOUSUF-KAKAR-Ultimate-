name: SYK homepage architecture checks
on:
  pull_request:
    paths:
      - "index.html"
      - "assets/sk-home-architecture-v1.*"
      - "scripts/check-home-architecture.mjs"
      - ".github/workflows/syk-home-architecture.yml"
  push:
    branches: [main, 'redesign/**']
    paths:
      - "index.html"
      - "assets/sk-home-architecture-v1.*"
      - "scripts/check-home-architecture.mjs"
      - ".github/workflows/syk-home-architecture.yml"
jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check assets/sk-home-architecture-v1.js
      - run: node scripts/check-home-architecture.mjs
      - run: node scripts/check-static.mjs
