name: SK Android debug build

on:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle -p android --no-daemon assembleDebug
      - name: Verify APK package before publishing
        shell: bash
        run: |
          set -euxo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"
          file "$APK"
          unzip -t "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort | tail -n 1)"
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" | tee /tmp/sk-apk-badging.txt
          grep -F "package: name='com.saad.yusufkakar.skhub'" /tmp/sk-apk-badging.txt
      - name: Upload debug APK for testing
        uses: actions/upload-artifact@v4
        with:
          name: sk-cyber-hub-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
