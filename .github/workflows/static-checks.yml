name: SK Cyber Hub static security checks

on:
  push:
    branches:
      - main
      - foundation/unified-resource-catalog
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check inline JavaScript and basic browser safety
        run: node scripts/check-static.mjs
